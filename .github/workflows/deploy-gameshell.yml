name: Deploy GameShell

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Configure private repo access
        run: |
          git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Build GameShell
        run: yarn build

      - name: Upload build to temp folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'dist/**'
          target: '/tmp/gameshell-deploy'
          strip_components: 1
          overwrite: true
          rm: true
          debug: true

      - name: Move build to Nginx folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/showroom-gameshell
            sudo rm -rf /var/www/showroom-gameshell/*
            sudo cp -r /tmp/gameshell-deploy/* /var/www/showroom-gameshell/
            sudo chown -R www-data:www-data /var/www/showroom-gameshell
            sudo chmod -R 755 /var/www/showroom-gameshell
            sudo rm -rf /tmp/gameshell-deploy
            sudo nginx -t
            sudo systemctl reload nginx
